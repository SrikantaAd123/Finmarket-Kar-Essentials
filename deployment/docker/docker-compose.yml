
services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: finmarket-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - finmarket-network

  mysql:
    image: mysql:8.4
    container_name: finmarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finmarket}
      MYSQL_USER: ${MYSQL_USER:-finmarket_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -p${MYSQL_ROOT_PASSWORD:-change_this_root_password}
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - finmarket-network

  nginx:
    image: nginx:alpine
    container_name: finmarket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - finmarket-network

  prometheus:
    image: prom/prometheus:latest
    container_name: finmarket-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - finmarket-network

volumes:
  mysql-data:
  prometheus-data:

networks:
  finmarket-network:
    driver: bridge
