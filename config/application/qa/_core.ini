; FinMkt core — qa
; One INI file per package in this folder
; (fastapi.ini, zitadel_auth.ini, etc.)

; Each key in package files has a comment above it explaining usage.

; Secrets: config/secrets/secrets.qa.env
; Active environment: FINMKT_ENV in project .env

[finmkt]

; Active environment name (must match folder: dev | qa | prod).
environment = qa

; Bumped when finmkt-init layout changes.
; Run finmkt-init --force after upgrades.
config_version = 11
