
# ============================================================
# WorkSphere Enterprise - Alembic Configuration
# ============================================================

[alembic]

# Migration scripts directory
script_location = %(here)s/alembic

# Project root for Python imports
prepend_sys_path = %(here)s

# Windows-compatible path separator
path_separator = os

# Database URL is loaded from:
# backend/database/connection.py
#
# Do not configure sqlalchemy.url here.


# ============================================================
# LOGGING CONFIGURATION
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
